[project]
name = "bioshake"
version = "0.1.0"
description = "BioShake driver and edge service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "numpy>=2.4.3",
    "parse>=1.21.1",
    "psutil>=7.0.0",
    "puda>=0.0.16",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyserial>=3.5",
    "python-dotenv>=1.2.1",
    "setuptools<84",
    "websocket-client>=1.8.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioshake_driver"]
